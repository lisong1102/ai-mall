# ai-mall 入口层：静态站点 + API 反向代理
# 与开发环境 Vite proxy 保持同一路径约定：
#   /            → SPA 静态资源（history 路由回退 index.html）
#   /api/mall/** → mall-api:8080（重写为 /api/**）
#   /api/ai/**   → ai-service:3001（重写为 /api/**，关闭缓冲支持流式）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/mall/ {
        proxy_pass http://mall-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ai/ {
        proxy_pass http://ai-service:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
