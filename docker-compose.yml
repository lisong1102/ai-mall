services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-mall-postgres
    environment:
      POSTGRES_USER: mall
      POSTGRES_PASSWORD: mall
      POSTGRES_DB: ai_mall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mall -d ai_mall"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Java 业务服务：仅内网，经 nginx 反向代理暴露
  mall-api:
    build: ./services/mall-api
    container_name: ai-mall-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_mall
      POSTGRES_USER: mall
      POSTGRES_PASSWORD: mall
      # 生产部署请在 .env 中提供 JWT_SECRET（${VAR:-默认值} 兜底仅用于本机演示）
      JWT_SECRET: ${JWT_SECRET:-ai-mall-prod-please-change-this-jwt-secret-0123456789}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    depends_on:
      postgres:
        condition: service_healthy

  # AI 服务（Next.js 纯 API）：仅内网，服务端调 Java 走容器网络
  ai-service:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    container_name: ai-mall-ai
    environment:
      MALL_API_BASE: http://mall-api:8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_mall
      POSTGRES_USER: mall
      POSTGRES_PASSWORD: mall
      # db.ts/checkpointer 启动时强校验，容器内走服务名 postgres
      DATABASE_URL: postgresql://mall:mall@postgres:5432/ai_mall
      # 必须与 mall-api 使用同一个 HS256 密钥，AI 服务才能校验后台签发的 JWT（auth.ts）
      JWT_SECRET: ${JWT_SECRET:-ai-mall-prod-please-change-this-jwt-secret-0123456789}
      # LLM/Embedding 密钥：生产在 .env 中提供；变量名与代码 process.env 读取严格一致（区分大小写）
      Deepseek_API_KEY: ${Deepseek_API_KEY:-}
      Kimi_API_KEY: ${Kimi_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      mall-api:
        condition: service_started

  # 入口层：nginx 托管前端静态产物并反代两个后端，唯一对外端口
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai-mall-web
    ports:
      - "80:80"
    depends_on:
      - mall-api
      - ai-service

volumes:
  pgdata:
