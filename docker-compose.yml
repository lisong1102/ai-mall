services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-mall-postgres
    environment:
      POSTGRES_USER: mall
      POSTGRES_PASSWORD: mall
      POSTGRES_DB: ai_mall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mall -d ai_mall"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
