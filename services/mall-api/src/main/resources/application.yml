server:
  port: 8080

spring:
  application:
    name: mall-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_mall}?currentSchema=mall
    username: ${POSTGRES_USER:mall}
    password: ${POSTGRES_PASSWORD:mall}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: mall
    default-schema: mall
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# JWT 鉴权配置（P1.8）：HS256 对称密钥，生产环境通过 JWT_SECRET 环境变量覆盖，左边是默认值，如果没有设置环境变量，使用默认值
jwt:
  secret: ${JWT_SECRET:ai-mall-dev-jwt-secret-please-change-in-production-0123456789}
  # token 有效期（毫秒），默认 24 小时
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
